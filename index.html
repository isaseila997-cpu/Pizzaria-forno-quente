<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forno & Brasa | Pizzaria Artesanal</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #181210; color: #FFF8F0; line-height: 1.5; }
    
    /* TOPO */
    header {
      background: #221916;
      border-bottom: 2px solid #E63946;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      background: linear-gradient(135deg, #E63946, #F77F00);
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .logo h1 { font-family: 'Fraunces', serif; font-size: 1.3rem; color: #FFF8F0; }
    
    .btn-sacola {
      background: linear-gradient(135deg, #E63946, #F77F00);
      color: #fff; border: none; padding: 10px 18px; border-radius: 50px;
      font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
    }
    .badge { background: #181210; color: #FCBF49; padding: 2px 8px; border-radius: 50px; font-size: 0.8rem; }

    /* BANNER */
    .hero {
      background: linear-gradient(135deg, #2D1614 0%, #181210 100%);
      padding: 45px 5%;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .tag-aberta {
      display: inline-block; background: rgba(37, 211, 102, 0.15); color: #6EE7B7;
      border: 1px solid #25D366; padding: 5px 14px; border-radius: 50px;
      font-size: 0.8rem; font-weight: 700; margin-bottom: 14px;
    }
    .hero h2 { font-family: 'Fraunces', serif; font-size: 2.2rem; margin-bottom: 12px; color: #FFF8F0; }
    .hero h2 span { color: #FCBF49; }
    .hero p { color: #D1C4BE; max-width: 550px; margin: 0 auto 24px; }
    .hero-btns { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    
    .btn-wpp {
      background: #25D366; color: #120E0D; text-decoration: none;
      padding: 12px 24px; border-radius: 50px; font-weight: 800; display: inline-block;
    }

    /* CARDÁPIO */
    .container { max-width: 1150px; margin: 0 auto; padding: 40px 5%; }
    .titulo-secao { font-family: 'Fraunces', serif; font-size: 1.8rem; margin-bottom: 20px; color: #FCBF49; }
    
    .filtros { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 28px; padding-bottom: 5px; }
    .filtro-btn {
      background: #261D1A; color: #FFF8F0; border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 18px; border-radius: 50px; cursor: pointer; font-weight: 600; white-space: nowrap;
    }
    .filtro-btn.ativo { background: #E63946; border-color: #E63946; }

    .grid-pizzas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 22px;
    }
    .card {
      background: #241B18;
      border: 1px solid rgba(252, 191, 73, 0.18);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img { width: 100%; height: 185px; object-fit: cover; }
    .card-conteudo { padding: 18px; flex: 1; display: flex; flex-direction: column; }
    .card-tag {
      align-self: flex-start; background: rgba(252, 191, 73, 0.15); color: #FCBF49;
      font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 50px; margin-bottom: 8px;
    }
    .card h3 { font-family: 'Fraunces', serif; font-size: 1.2rem; margin-bottom: 6px; }
    .card p { color: #B8A9A2; font-size: 0.88rem; margin-bottom: 16px; flex: 1; }
    .card-rodape {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px;
    }
    .preco { font-size: 1.2rem; font-weight: 800; color: #FCBF49; }
    .btn-add {
      background: linear-gradient(135deg, #E63946, #F77F00); color: #fff;
      border: none; padding: 9px 16px; border-radius: 50px; font-weight: 700; cursor: pointer;
    }

    /* SACOLA LATERAL */
    .fundo-escuro {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; z-index: 90;
    }
    .fundo-escuro.aberto { display: block; }
    .gaveta {
      position: fixed; top: 0; right: -100%; width: 100%; max-width: 390px; height: 100vh;
      background: #1E1614; z-index: 100; transition: 0.3s; display: flex; flex-direction: column;
      border-left: 2px solid #E63946;
    }
    .gaveta.aberta { right: 0; }
    .gaveta-topo {
      padding: 18px; border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex; justify-content: space-between; align-items: center;
    }
    .gaveta-lista { flex: 1; overflow-y: auto; padding: 18px; }
    .item-sacola {
      background: #281E1B; padding: 12px; border-radius: 12px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .qtd-box { display: flex; align-items: center; gap: 10px; }
    .qtd-btn {
      background: #E63946; color: #fff; border: none; width: 26px; height: 26px;
      border-radius: 50%; font-weight: 800; cursor: pointer;
    }
    .gaveta-fim { padding: 18px; background: #16100E; border-top: 1px solid rgba(255,255,255,0.1); }
    .campo-obs {
      width: 100%; padding: 11px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
      background: #261D1A; color: #fff; margin-bottom: 12px;
    }
    .btn-finalizar {
      width: 100%; background: #25D366; color: #120E0D; border: none; padding: 14px;
      border-radius: 50px; font-weight: 800; font-size: 1rem; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">🍕</div>
      <h1 id="nomeLojaTopo">Forno & Brasa</h1>
    </div>
    <button class="btn-sacola" onclick="abrirSacola()">
      🛒 Pedido <span class="badge" id="contador">0</span>
    </button>
  </header>

  <section class="hero">
    <div class="tag-aberta">🟢 Forno a lenha aceso • Delivery rápido</div>
    <h2>Pizzas Artesanais com <span>Muito Queijo</span></h2>
    <p>Escolha seus sabores favoritos abaixo, monte sua sacola e envie seu pedido direto no nosso WhatsApp.</p>
    <div class="hero-btns">
      <a href="#" id="linkWppTopo" target="_blank" class="btn-wpp">💬 Tirar Dúvida no WhatsApp</a>
    </div>
  </section>

  <main class="container">
    <h2 class="titulo-secao">🔥 Nosso Cardápio</h2>
    
    <div class="filtros">
      <button class="filtro-btn ativo" onclick="filtrar('Todas', this)">Todas</button>
      <button class="filtro-btn" onclick="filtrar('Tradicionais', this)">Tradicionais</button>
      <button class="filtro-btn" onclick="filtrar('Especiais', this)">Especiais</button>
      <button class="filtro-btn" onclick="filtrar('Doces', this)">Doces</button>
      <button class="filtro-btn" onclick="filtrar('Bebidas', this)">Bebidas</button>
    </div>

    <div class="grid-pizzas" id="vitrine"></div>
  </main>

  <div class="fundo-escuro" id="fundo" onclick="abrirSacola()"></div>
  <aside class="gaveta" id="gaveta">
    <div class="gaveta-topo">
      <h3>🍕 Seu Pedido</h3>
      <button onclick="abrirSacola()" style="background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;">✕</button>
    </div>
    <div class="gaveta-lista" id="listaSacola">
      <p style="color:#B8A9A2; text-align:center; margin-top:30px;">Sua sacola está vazia.</p>
    </div>
    <div class="gaveta-fim">
      <input type="text" id="obsPedido" class="campo-obs" placeholder="Endereço de entrega ou borda recheada...">
      <div style="display:flex; justify-content:space-between; margin-bottom:14px; font-size:1.1rem;">
        <span>Total:</span>
        <strong style="color:#FCBF49;" id="valorTotal">R$ 0,00</strong>
      </div>
      <button class="btn-finalizar" onclick="enviarWhatsApp()">📲 Enviar Pedido no WhatsApp</button>
    </div>
  </aside>

  <script>
    // ⚙️ EDITE AQUI OS DADOS DO CLIENTE
    const DADOS_LOJA = {
      nome: "Forno & Brasa",
      whatsapp: "5534999999999"
    };

    const CARDAPIO = [
      { id: 1, nome: "Margherita Imperial", cat: "Tradicionais", preco: 49.90, tag: "Mais Pedida", desc: "Molho de tomate pelati, muçarela fresca, manjericão e azeite.", img: "https://unsplash.com" },
      { id: 2, nome: "Calabresa na Brasa", cat: "Tradicionais", preco: 52.90, tag: "Clássica", desc: "Calabresa artesanal defumada, cebola roxa e muçarela.", img: "https://unsplash.com" },
      { id: 3, nome: "Quatro Queijos Trufada", cat: "Especiais", preco: 64.90, tag: "Especial", desc: "Muçarela, gorgonzola, parmesão, catupiry e mel trufado.", img: "https://unsplash.com" },
      { id: 4, nome: "Pepperoni Crispy", cat: "Especiais", preco: 62.90, tag: "Crocante", desc: "Dupla camada de pepperoni americano e muito queijo.", img: "https://unsplash.com" },
      { id: 5, nome: "Chocolate com Morango", cat: "Doces", preco: 48.90, tag: "Doce", desc: "Ganache de chocolate nobre com morangos frescos.", img: "https://unsplash.com" },
      { id: 6, nome: "Coca-Cola 2 Litros", cat: "Bebidas", preco: 14.00, tag: "Gelada", desc: "Garrafa 2L bem gelada para acompanhar.", img: "https://unsplash.com" }
    ];

    let sacola = [];
    document.getElementById("nomeLojaTopo").innerText = DADOS_LOJA.nome;
    document.getElementById("linkWppTopo").href = https://wa.me{DADOS_LOJA.whatsapp};
function mostrarVitrine(lista) {
const vitrine = document.getElementById("vitrine");
vitrine.innerHTML = lista.map(p => <div class="card"> <img src="${p.img}" alt="${p.nome}"> <div class="card-conteudo"> <span class="card-tag">${p.tag}</span> <h3>${p.nome}</h3> <p>${p.desc}</p> <div class="card-rodape"> <span class="preco">R$ ${p.preco.toFixed(2).replace('.', ',')}</span> <button class="btn-add" onclick="adicionar(${p.id})">+ Adicionar</button> </div> </div> </div>).join('');
}
function filtrar(categoria, botao) {
document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
botao.classList.add('ativo');
if (categoria === 'Todas') mostrarVitrine(CARDAPIO);
else mostrarVitrine(CARDAPIO.filter(p => p.cat === categoria));
}
function adicionar(id) {
const item = CARDAPIO.find(p => p.id === id);
const naSacola = sacola.find(i => i.id === id);
if (naSacola) naSacola.qtd++;
else sacola.push({ ...item, qtd: 1 });
atualizarSacola();
}
function mudarQtd(id, delta) {
const item = sacola.find(i => i.id === id);
if (!item) return;
item.qtd += delta;
if (item.qtd <= 0) sacola = sacola.filter(i => i.id !== id);
atualizarSacola();
}
function atualizarSacola() {
const totalItens = sacola.reduce((s, i) => s + i.qtd, 0);
const totalValor = sacola.reduce((s, i) => s + (i.preco * i.qtd), 0);
document.getElementById("contador").innerText = totalItens;
document.getElementById("valorTotal").innerText = R$ ${totalValor.toFixed(2).replace('.', ',')};
const lista = document.getElementById("listaSacola");
if (sacola.length === 0) {
lista.innerHTML = 'Sua sacola está vazia.';
return;
}
lista.innerHTML = sacola.map(i => <div class="item-sacola"> <div> <strong>${i.nome}</strong><br> <span style="color:#FCBF49;">R$ ${(i.preco * i.qtd).toFixed(2).replace('.', ',')}</span> </div> <div class="qtd-box"> <button class="qtd-btn" onclick="mudarQtd(${i.id}, -1)">-</button> <span>${i.qtd}</span> <button class="qtd-btn" onclick="mudarQtd(${i.id}, 1)">+</button> </div> </div>).join('');
}
function abrirSacola() {
document.getElementById("gaveta").classList.toggle("aberta");
document.getElementById("fundo").classList.toggle("aberto");
}
function enviarWhatsApp() {
if (sacola.length === 0) return alert("Adicione pelo menos 1 item na sacola!");
const obs = document.getElementById("obsPedido").value;
const total = sacola.reduce((s, i) => s + (i.preco * i.qtd), 0);
let msg = 🍕 *PEDIDO - ${DADOS_LOJA.nome.toUpperCase()}*\n\n;
sacola.forEach(i => msg += • ${i.qtd}x ${i.nome} (R$ ${(i.preco * i.qtd).toFixed(2).replace('.', ',')})\n);
msg += \n💰 *Total:* R$ ${total.toFixed(2).replace('.', ',')};
if (obs) msg += \n📍 *Obs/Endereço:* ${obs};
window.open(https://wa.me{DADOS_LOJA.whatsapp}?text=${encodeURIComponent(msg)}, '_blank');
}
mostrarVitrine(CARDAPIO);
