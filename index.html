<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forno & Brasa | Pizzaria Artesanal</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #120E0D;
      --bg-card: #1E1715;
      --bg-card-hover: #271E1B;
      --primary-red: #E63946;
      --primary-orange: #F77F00;
      --cheese-gold: #FCBF49;
      --whatsapp-green: #25D366;
      --whatsapp-dark: #128C7E;
      --text-light: #FFF8F0;
      --text-muted: #B8A9A2;
      --border-subtle: rgba(255, 248, 240, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(18, 14, 13, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-light);
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-red), var(--primary-orange));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
    }

    .brand-text h1 {
      font-family: 'Fraunces', serif;
      font-size: 1.35rem;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .brand-text span {
      font-size: 0.72rem;
      color: var(--cheese-gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-decoration: none;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.03);
    }

    .btn-fire {
      background: linear-gradient(135deg, var(--primary-red), var(--primary-orange));
      color: #fff;
      box-shadow: 0 6px 20px rgba(230, 57, 70, 0.4);
    }

    .btn-outline {
      background: rgba(255, 248, 240, 0.06);
      color: var(--text-light);
      border: 1px solid rgba(255, 248, 240, 0.18);
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, var(--whatsapp-green), var(--whatsapp-dark));
      color: #fff;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
    }

    .cart-trigger {
      position: relative;
      background: var(--bg-card);
      border: 1px solid rgba(252, 191, 73, 0.35);
      color: var(--text-light);
      padding: 10px 18px;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cart-badge {
      background: var(--primary-red);
      color: white;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 50px;
    }

    .hero {
      padding: 55px 5% 45px;
      background: radial-gradient(circle at 80% 20%, rgba(230, 57, 70, 0.22), transparent 50%),
                  radial-gradient(circle at 15% 80%, rgba(247, 127, 0, 0.16), transparent 50%);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 40px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(37, 211, 102, 0.12);
      border: 1px solid rgba(37, 211, 102, 0.35);
      color: #6EE7B7;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--whatsapp-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--whatsapp-green);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    .hero h2 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2.2rem, 4.5vw, 3.6rem);
      line-height: 1.08;
      margin-bottom: 18px;
    }

    .hero h2 span {
      background: linear-gradient(90deg, var(--cheese-gold), var(--primary-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 28px;
      max-width: 520px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .hero-image-wrap {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .hero-image-wrap img {
      width: 100%;
      max-width: 440px;
      border-radius: 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65);
      border: 2px solid rgba(252, 191, 73, 0.25);
      object-fit: cover;
      aspect-ratio: 1/1;
    }

    .floating-tag {
      position: absolute;
      bottom: -14px;
      left: 10%;
      background: var(--bg-card);
      border: 1px solid var(--cheese-gold);
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .menu-section {
      max-width: 1280px;
      margin: 20px auto 70px;
      padding: 0 5%;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 28px;
    }

    .section-header h3 {
      font-family: 'Fraunces', serif;
      font-size: 2rem;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .cat-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }

    .cat-btn.active {
      background: linear-gradient(135deg, var(--primary-red), var(--primary-orange));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(230, 57, 70, 0.35);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: rgba(252, 191, 73, 0.4);
      background: var(--bg-card-hover);
    }

    .card-img-box {
      position: relative;
      height: 195px;
      overflow: hidden;
    }

    .card-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .product-card:hover .card-img-box img {
      transform: scale(1.07);
    }

    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(18, 14, 13, 0.85);
      color: var(--cheese-gold);
      border: 1px solid rgba(252, 191, 73, 0.4);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 50px;
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-family: 'Fraunces', serif;
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 18px;
      flex: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
    }

    .price {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--cheese-gold);
    }

    .price small {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .btn-add {
      padding: 10px 18px;
      font-size: 0.85rem;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: #181210;
      border-left: 1px solid var(--border-subtle);
      z-index: 201;
      display: flex;
      flex-direction: column;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    function showToast(msg) {
const toast = document.getElementById("toast");
toast.innerText = msg;
toast.classList.add("show");
setTimeout(() => toast.classList.remove("show"), 2200);
}
function sendOrderToWhatsapp() {
if (cart.length === 0) {
showToast("⚠️ Adicione pelo menos 1 item antes de enviar!");
return;
}
const obs = document.getElementById("orderObs").value.trim();
const totalPrice = cart.reduce((acc, item) => acc + (item.preco * item.qty), 0);
let texto = 🍕 *NOVO PEDIDO - ${CONFIG.nomePizzaria.toUpperCase()}* 🍕\n\n;
cart.forEach(item => {
texto += ▪️ *${item.qty}x ${item.nome}* — ${formatBRL(item.preco * item.qty)}\n;
});
texto += \n💰 *Total Estimado:* ${formatBRL(totalPrice)};
if (obs) {
texto += \n📝 *Observações / Endereço:* ${obs};
}
texto += \n\n_Pedido montado pelo Cardápio Digital_;
const url = https://wa.me{CONFIG.whatsappNumero}?text=${encodeURIComponent(texto)};
window.open(url, "_blank");
}
renderProducts(PRODUTOS);
